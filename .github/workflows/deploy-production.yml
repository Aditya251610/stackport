name: deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/tunnel-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Sync compose files to VM
        run: |
          gcloud compute scp docker-compose.yml Caddyfile \
            "${{ vars.VM_NAME }}:~/stackport/" \
            --zone="${{ vars.VM_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap

      - name: Deploy on VM
        run: |
          gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone="${{ vars.VM_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --command="mkdir -p ~/stackport && cd ~/stackport && \
              printf 'DOMAIN=%s\nIMAGE=%s\n' '${{ vars.DOMAIN }}' '$IMAGE' > .env && \
              sudo docker compose pull && \
              sudo docker compose up -d --remove-orphans"
